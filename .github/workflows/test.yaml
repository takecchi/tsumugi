name: Test Workflow
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

# ブランチごとに並行実行を制御
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-draft:
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.check.outputs.is_draft }}
    steps:
      - id: check
        run: echo "is_draft=${{ github.event.pull_request.draft }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      # 歯。門の「形」を、必ず走るこの job から測る。
      #
      # なぜ check-draft の中なのか:
      #   この job は 4 つのうち唯一 if: も needs: も持たない。⟹ draft でも非 draft でも
      #   必ず走る。⟹ pull_request の workflow は head 版で走るので、門の形を壊した
      #   その PR 自身がここで赤くなる。
      #   (check_paths に置いた歯とは対照的である。あちらは filter の行を消すと
      #    check_paths ごと skip されるので、歯も一緒に消えて捕まらない。同じ理屈を
      #    check-draft に当てると、逆に「消えない場所」になる。)
      #
      # 検査 1: on.pull_request.types に ready_for_review が在ること。
      #   check-draft は draft を止める門ではなく、draft のあいだ check_paths 以降を
      #   走らせないための切替器である (GitHub は draft の PR をそもそも merge させない)。
      #   ⟹ 走らせなかった分は借りになる。その借りを返しているのは types の
      #      `ready_for_review` の 1 語だけで、draft を出た瞬間に再発火させている。
      #   ⟹ 消えると: draft で開いた PR は required 4 本が全部緑 (skip は Success として
      #      報告される) になり、Ready for review を押しても再発火しないのでその緑が残る。
      #      build も tsc も lint も test も build-storybook も 1 本も走らないまま merge
      #      できる。しかも画面上は緑なので、押した人には見分けが付かない。
      #   実測 (PR #38): ready_for_review が 2026-08-03T03:20:34Z、その 2 秒後に
      #   run 30781577612 が同じ head SHA で走り、test_all が success になった。
      #
      # 検査 2: check_paths の if: が `!= 'true'` のままであること (#62)。
      #   `== 'false'` へ戻されると、is_draft が 'false' 以外の何か (空文字を含む) に
      #   なった瞬間に check_paths 以降が丸ごと skip され、draft ですらない普通の PR が
      #   テスト 0 本で required 4 本全緑になる。壊れ方が「黙って緑」なので、
      #   戻された結果そのものは赤くならない。⟹ だから「文字列の形」で測る。
      #
      # 検査 3: check-draft 自身に if: / needs: が付いていないこと。
      #   増やした理由: 上の 2 つが成り立つ前提そのものだから。この job が skip
      #   されうるようになると、検査 1 と 2 がまとめて消える。
      #
      # 検査 4: backend-released.yaml で checkout -B が版上げより前に在ること (#68)。
      #   この 1 件だけ、測る対象が test.yaml ではなく別の workflow である。
      #   backend-released.yaml は pull_request では発火しないので、あのファイルの
      #   中に置いた歯は PR の段では順序を守れない。⟹ 必ず走るこの job から測る。
      #   詳細は下の run: の中のコメントに在る。
      #
      # ⚠ この歯が測っていないこと (歯自身に名乗らせておく):
      #   - 測るのは「文字列の形」だけである。その if: が意図どおりに効くことは
      #     測っていない。`!= 'true'` のまま check-draft の step id を書き換えるなど、
      #     別の場所を壊せばこの歯は通る。形が正しいことと、効くことは別である。
      #   - 閉じてはいない。同じ PR で対象の行とこの歯を両方消せば、この歯も head 版
      #     から消えるので走らない。⟹ 上げたのは敷居だけである。repo の中に置く歯は、
      #     同じ PR で一緒に編集できる以上こうなる。
      #   - 検査 3 は自分を守れない。check-draft に if: を足す PR で、その if: が
      #     その PR 自身に対して偽なら、この job ごと skip されて検査 3 も走らない。
      #   - 検査 2 は式を厳密一致で見る。等価な書き換えでも赤くなる。意図的にそうして
      #     ある: 式の「意味」を機械で確かめる術が無いので、変えるなら歯も一緒に
      #     人間に更新させる。
      #   - ふだんこの歯は何も測っていない。types: の行は root commit (2026-02-01) 以来
      #     一度も編集されていない (全履歴を機械的に確認、編集 0 回)。
      #     ⟹ 「緑だった」を「門の形は正しい」と読まないこと。
      #   - 検査 1 は「types に書いてある」までである。draft の PR が実際に再走を経てから
      #     merge されたことは測っていない。それは PR #38 という 1 件の実測に拠っている
      #     (draft を経由した PR は全 51 PR 中この 1 件だけだった)。
      #   - yq が runner から消えたら、通さずに落とす。読めないものを緑にしない。
      #
      # yq を使う理由: 文字列一致だと types: の外に在る `ready_for_review` でも通る。
      #   手元で 5 通り撃って確かめた (yq 4.53.6 = runner image と同版):
      #     現物 → EXIT=0 / types から消す → EXIT=1 / コメントに文字列を残す → EXIT=1
      #     types: 行ごと消す → EXIT=1 / ブロック形式に整形 → EXIT=0
      - name: 門の形が保たれているか (この job は必ず走るので、ここからなら測れる)
        run: |
          set -euo pipefail
          F="${GITHUB_WORKSPACE}/.github/workflows/test.yaml"
          FAIL=0

          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq が runner に在りません。門の形を構造として読めないので、通さずに落とします"
            exit 1
          fi

          # 検査 1: on.pull_request.types に ready_for_review
          TYPES=$(yq -r '.on.pull_request.types[]' "$F" 2>/dev/null || true)
          if [ -z "${TYPES}" ]; then
            echo "::error::AssertionError [1]: on.pull_request.types を読めませんでした (構造が変わった可能性)。読めないものは通しません"
            FAIL=1
          elif ! printf '%s\n' "${TYPES}" | grep -qx 'ready_for_review'; then
            echo "::error::AssertionError [1]: on.pull_request.types に ready_for_review が在りません。draft の PR は required 4 本が緑のまま再発火しなくなり、テストが 1 本も走らずに merge できてしまいます"
            FAIL=1
          else
            echo "OK [1] on.pull_request.types: $(printf '%s ' ${TYPES})"
          fi

          # 検査 2: check_paths の if: が fail-closed のまま
          EXPECT="needs.check-draft.outputs.is_draft != 'true'"
          ACTUAL=$(yq -r '.jobs.check_paths.if // ""' "$F" 2>/dev/null | tr -s ' ' || true)
          if [ "${ACTUAL}" != "${EXPECT}" ]; then
            echo "::error::AssertionError [2]: check_paths の if: が変わっています。期待: ${EXPECT} / 実際: ${ACTUAL}。fail-open に戻ると、draft でない普通の PR がテスト 0 本で required 4 本全緑になります"
            FAIL=1
          else
            echo "OK [2] check_paths.if: ${ACTUAL}"
          fi

          # 検査 3: check-draft 自身が必ず走ること (if:/needs: を持たない)
          CD_IF=$(yq -r '.jobs["check-draft"].if // "null"' "$F" 2>/dev/null || true)
          CD_NEEDS=$(yq -r '.jobs["check-draft"].needs // "null"' "$F" 2>/dev/null || true)
          if [ "${CD_IF}" != "null" ] || [ "${CD_NEEDS}" != "null" ]; then
            echo "::error::AssertionError [3]: check-draft に if: / needs: が付きました (if=${CD_IF} needs=${CD_NEEDS})。この job が skip されうるようになると、検査 1 と 2 がまとめて消えます"
            FAIL=1
          else
            echo "OK [3] check-draft は if: も needs: も持ちません (必ず走ります)"
          fi

          # 検査 4: backend-released.yaml の checkout が版上げより前に在ること (#68)。
          #   `git checkout -B <branch> origin/main` は、汚れているファイルが HEAD と
          #   始点で異なると中断する (中身が始点と一致していても index が HEAD 版なので中断する)。
          #   ⟹ 版上げ (npm pkg set / npm install) が作業ツリーを汚したあとで打つと、
          #      run のチェックアウト以降に main がその2ファイルを動かしていた場合に落ちる。
          #      実測: run 34354449082 の attempt 2 (再実行) が
          #      `a42f57f..1dbdb21  main -> origin/main` のあとで中断した。
          #   ⟹ #68 で順序を入れ替えて直した。この歯はその順序が戻されていないかを測る。
          #
          #   なぜ test.yaml のこの job から測るのか:
          #     backend-released.yaml は repository_dispatch / workflow_dispatch でしか
          #     発火しない。⟹ PR の CI では 1 度も走らない。⟹ あちらの中に置いた実行時の
          #     歯 (checkout 直前で作業ツリーの汚れを測るもの) は、順序を戻す PR を
          #     PR の段では捕まえられない。ここなら PR ごとに必ず走る。
          #     (`.github/**` は check_paths の packages filter に入っているが、
          #      あちらは draft のあいだ skip される。ここは if: も needs: も無い。)
          #
          #   ⚠ この歯が測っていないこと (歯自身に名乗らせておく):
          #     - 測るのは step の並び順と BRANCH の接頭辞だけである。checkout -B が実際に
          #       成功することは測っていない。それは backend-released.yaml 側の実行時の歯と、
          #       #68 で手元で撃った git の実測に拠っている。
          #     - 版上げstepを `npm pkg set` / `npm install` という文字列で見つけている。
          #       別のコマンドで版を上げるよう書き換えられると、この歯は見落とす。
          #     - 最初に現れた checkout -B と、最初に現れた版上げしか見ていない。
          #       2 本目の checkout -B を版上げの後ろに足されると見落とす。
          #     - 閉じてはいない。同じ PR で順序とこの歯を両方いじれば通る。
          #       上げたのは敷居だけである (検査 1〜3 と同じ理屈)。
          B="${GITHUB_WORKSPACE}/.github/workflows/backend-released.yaml"
          if [ ! -f "$B" ]; then
            echo "::error::AssertionError [4]: ${B} が在りません。読めないものは通しません"
            FAIL=1
          else
            CO_IDX=$(yq -r '[.jobs.bump-client-version.steps[] | .run // ""] | to_entries | map(select(.value | test("git checkout -B"))) | .[0].key // "none"' "$B" 2>/dev/null || echo none)
            BUMP_IDX=$(yq -r '[.jobs.bump-client-version.steps[] | .run // ""] | to_entries | map(select(.value | test("npm pkg set|npm install"))) | .[0].key // "none"' "$B" 2>/dev/null || echo none)
            BRANCH_EXPR=$(yq -r '[.jobs.bump-client-version.steps[] | select((.run // "") | test("git checkout -B")) | .env.BRANCH // ""] | .[0] // ""' "$B" 2>/dev/null || echo "")

            if [ "${CO_IDX}" = "none" ]; then
              echo "::error::AssertionError [4]: backend-released.yaml に git checkout -B を打つ step が在りません。構造が変わったか、#68 の直しが消えています。読めないものは通しません"
              FAIL=1
            elif [ "${BUMP_IDX}" = "none" ]; then
              echo "::error::AssertionError [4]: backend-released.yaml に版上げ (npm pkg set / npm install) の step が在りません。構造が変わっています。読めないものは通しません"
              FAIL=1
            elif [ "${CO_IDX}" -ge "${BUMP_IDX}" ]; then
              echo "::error::AssertionError [4]: backend-released.yaml で git checkout -B (steps[${CO_IDX}]) が版上げ (steps[${BUMP_IDX}]) より後ろに在ります。汚れた作業ツリーでの checkout -B は、run のチェックアウト以降に main が package.json / package-lock.json を動かしていると中断します (#68)。とくに再実行が塞がれます"
              FAIL=1
            elif [ "${BRANCH_EXPR#chore/bump-client-}" = "${BRANCH_EXPR}" ]; then
              echo "::error::AssertionError [4]: checkout -B する step の env.BRANCH が chore/bump-client- で始まっていません (実際: ${BRANCH_EXPR})。直後に force push するため、手作業の追随PRが使う chore/client-<version> へ揃えるとそれを踏み潰します"
              FAIL=1
            else
              echo "OK [4] backend-released.yaml: checkout -B は steps[${CO_IDX}]、版上げは steps[${BUMP_IDX}] (checkout が先) / BRANCH=${BRANCH_EXPR}"
            fi
          fi

          exit ${FAIL}

  check_paths:
    needs: check-draft
    # draft のときだけ skip する。判定できないときは走らせる (fail-closed)。
    #
    # `== 'false'` ではなく `!= 'true'` である理由:
    #   is_draft は check-draft が `github.event.pull_request.draft` を文字列として
    #   書いたもの。`== 'false'` だと、is_draft が 'false' 以外の「何か」(空文字を含む)
    #   になった瞬間に、この job も下流の test_all / test_desktop も丸ごと skip される。
    #   job の if: による skip を GitHub は Success として報告するので、結果は
    #   「draft ですらない普通の PR で、required 4 本が全部緑・テストは 1 本も走らない」。
    #   is_draft が空になる経路は、たとえば check-draft の `id: check` を書き換えて
    #   output が出なくなる、`on:` に pull_request 以外を足して
    #   github.event.pull_request が無い文脈が来る、など。
    #   ⟹ 既定が「skip」だと、壊れ方が「黙って緑」になる。だから既定を「走らせる」にする。
    #
    # ⚠ 既存の歯 (下の「filter が見張り対象を拾えているか」) はこれを捕まえない。
    #   あの歯はこの job の中に在るので、この job ごと skip されれば一緒に消える。
    #
    # ⚠ 訂正 (#62 で「この変更を守る歯は置けない」と書いたが、あれは偽だった)。
    #   この行が `== 'false'` へ戻されても、戻された結果そのものは赤くならない
    #   (壊れ方が「黙って緑」だから)。⟹ しかし戻された「文字列」は外から読める。
    #   ⟹ check-draft は if: も needs: も持たず必ず走るので、あちらに置いた歯が
    #      この行の形を測っている。この job の中に置けないだけで、置けなくはなかった。
    #   実測 (2026-09-09): test.yaml の run 65 件のうち、is_draft=false なのに
    #   この job が skipped だった run は 0 件。まだ一度も起きていない壊れ方である。
    #
    # draft の PR での挙動はこの変更で変わらない ('true' なら従来どおり skip)。
    if: needs.check-draft.outputs.is_draft != 'true'
    runs-on: ubuntu-latest
    # 下の歯が PR の変更ファイル一覧を読むために要る
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages_changed: ${{ steps.filter.outputs.packages }}
      desktop_changed: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        name: Check changed files
        # node20 は 2026-09-23 に runner から削除される。⟹ v3 は runs.using が node20
        # なので、その日に動かなくなる。この repo に残っていた node20 の action は
        # これ 1 箇所だった (checkout / setup-node は #66 で v6 = node24 へ移行済み)。
        #
        # v4 を選ぶ根拠 (upstream の現物を読んで確かめた):
        #   v4.0.0 の変更は「action runtime を node24 にする」1 件だけ (upstream PR #294)。
        #   action.yml の inputs: / outputs: は v3 (= v3.0.4) と v4 (= v4.0.3) で
        #   名前・既定値ともに同一だった。差分は 2 点しかない:
        #     - predicate-quantifier の description が増えた
        #       ('some-with-excludes' が選べるようになった。既定は 'some' のまま)
        #     - runs.using: node20 → node24
        #   ⟹ ここが渡しているのは filters: だけなので、渡している入力に触る変更は 0 件。
        #
        # ⚠ この上げの挙動上の risk が低い理由 (「無い」ではない):
        #   2026-06-16 の既定切替以降、この action はすでに node24 の上で強制実行されて
        #   いる (runner が「node20 を狙う action を node24 で走らせている」と注釈を
        #   出している)。⟹ 9/23 に変わるのは「警告付きで動く」→「動かない」だけである。
        #   ⟹ node24 での動作は、この上げの前からこの repo の門で毎回試されていた。
        uses: dorny/paths-filter@v4
        with:
          # turbo.json / .npmrc がここに在る理由は実測にある。ルート設定 8 ファイルを
          # 1 つずつ壊して test_all の 5 工程 (build/tsc/lint/test/build-storybook) を
          # 回したところ、CI が落ちたのはこの 2 つだけだった。
          #   turbo.json  … tasks の "test" を "tests" に打ち間違える → npm run test が EXIT=1
          #   .npmrc      … registry を到達不能にする → npm install が EXIT=1
          #                  (冷えたキャッシュでのみ再現する。素の .npmrc なら同条件で EXIT=0)
          # 残る 6 つ (eslint.config.js / .lintstagedrc.js / .depcheckrc.json /
          # .prettierrc / .prettierignore / .mise.toml) は壊しても 5 工程すべて緑だった。
          # ⟹ ここへ足しても「走った」が増えるだけで、拾えるものは 1 つも増えない。
          # 詳細と対照の取り方は、この変更の PR 本文にある。
          #
          # 追記: 上の 6 つのうち eslint.config.js と .depcheckrc.json は、CI だけでなく
          # 手元にも消費者が居ないことを確かめたうえで削除した (ルート設定は 6 ファイルになった)。
          # 残りの 4 つは CI では緑でも手元では読まれているので、消していない:
          #   .lintstagedrc.js            … pre-commit の lint-staged が実際にこれを選ぶ
          #   .prettierrc / .prettierignore … prettier が読む (値を足すと --check の件数が変わる)
          #   .mise.toml                  … README が案内している手元セットアップの入口
          # ⟹ 「CI で緑」を「誰も読んでいない」と読まないこと。
          #
          # `.github/**` がここに在る理由 (2026-09-09 に数えた)。
          # ここに `.github/**` が無かったあいだ、test.yaml を書き換える PR では
          # packages も desktop も false になり、test_all と test_desktop が両方
          # skip されていた。job の if: による skip を GitHub は Success として
          # 報告するので、required 4 本 (check-draft / check_paths / test_all /
          # test_desktop) が全部緑のまま、テストを 1 本も走らせずに main へ入る。
          #   実測: 保護された main へマージ済み 43 件のうち 5 件
          #         (#24 / #36 / #48 / #49 / #55)。run では 62 件中 12 件 (19.4%) で
          #         テストが 1 本も走っていない。
          #   ⚠ #24 と #36 の当時この repo に protection が在ったかは検証できて
          #     いない (public repo でも protection の変更履歴は API から取れない)。
          #     ⟹ 現在の設定下だと確実に言えるのは #48 / #49 / #55 の 3 件。
          #   ⟹ とくに #55 は test.yaml 1 ファイルだけを触った PR である。
          #     「門の定義を書き換える PR が、その門に一度も検査されないまま
          #      merge された」実例そのものだった。
          #
          # 費用は測った。これを足して新たに test_all が走るようになるのは全 62 run
          # のうち 4 run (+6.5%)。test_all の所要は中央値 99 秒 (最大 215 秒) なので
          # 6.4 か月ぶんで約 6.6 分、月あたり約 1 分。
          # ⟹ paths-filter ごと外して「常に全部走らせる」必要は無い。1 行で足りる。
          #
          # ⚠ もともと `.github/**` がここに無かったのが、意図的な除外だったのか
          #   見落としだったのかは分からない。上のコメントはルート設定 8 ファイルに
          #   ついて「壊しても緑だった」と実測を書いているが、`.github/**` 自身に
          #   ついては何も書いていない。
          filters: |
            packages:
              - 'package.json'
              - 'package-lock.json'
              - 'packages/**'
              - 'turbo.json'
              - '.npmrc'
              # 門の定義そのもの。理由は直上のコメントに在る。
              - '.github/**'
            desktop:
              - 'apps/desktop/**'

      # 歯。filter の「設定の文面」ではなく「判定結果」を測る。
      # 変更ファイル一覧を paths-filter とは別の経路 (PR の files API) で取り直し、
      # 見張り対象が変わっているのに packages が true でなければ落とす。
      #
      # ⚠ この歯が要る理由 (実測 2026-09-09)。上の 1 行だけでは閉じない:
      #   pull_request の workflow は PR の head 版で走る。base 版ではない。
      #   ⟹ 上の `- '.github/**'` を消す PR は、消した状態で判定される。その回に
      #      test_all は走らないので、「消したこと」がその回の門に見られることは無い。
      #   ⟹ 裏は取ってある: PR #55 の run 34302274054 の check_paths の step 一覧に、
      #      #55 自身がそこで追加した歯の step が入っていた。⟹ head 版で走っている。
      #   ⟹ だから filter の 1 行を「消えたら落ちる」形で支えるものが要る。それがこの歯。
      #   ⟹ 同じ理由で、逆向きにも効く。`.github/**` を足したこの PR 自身が新しい filter
      #      で判定されるので、この PR では test_all が走る (skip されない)。
      #
      # ⚠ この歯の限界を、歯自身が名乗っておく:
      #   - 見張り対象 (turbo.json / .npmrc / .github/**) を触る PR でしか発火しない。
      #     全 48 PR のうち .github/** を含むのは 9 件。ふだんこの歯は何も測っていない。
      #     ⟹ 「緑だった」を「filter は正しい」と読まないこと。
      #   - filter の行とこの歯を「同じ PR で両方」消せば、この歯も走らないので捕まらない。
      #     ⟹ 閉じてはいない。上げたのは敷居だけである。repo の中に置く歯は、同じ PR で
      #        一緒に編集できる以上こうなる。ここを閉じたいなら repo の外に置くしかない。
      #   - 測るのは packages が true になるかどうかまで。test_all がその壊れを実際に
      #     落とすかは見ていない (それは手元での実測に拠っている)。
      - name: filter が見張り対象を拾えているか (判定結果で測る)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGES_CHANGED: ${{ steps.filter.outputs.packages }}
        run: |
          set -euo pipefail
          CHANGED=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          WATCHED=$(printf '%s\n' "$CHANGED" | grep -E '^(turbo\.json|\.npmrc)$|^\.github/' || true)
          if [ -z "$WATCHED" ]; then
            echo "turbo.json / .npmrc / .github/** は変更されていません。この歯はこの PR では何も測っていません"
            exit 0
          fi
          echo "変更されています:"
          printf '  %s\n' ${WATCHED}
          if [ "${PACKAGES_CHANGED}" != 'true' ]; then
            echo "::error::AssertionError: turbo.json / .npmrc / .github/** が変わったのに check_paths の packages が '${PACKAGES_CHANGED}' です (期待: true)。この PR ではテストが 1 本も走りません"
            exit 1
          fi
          echo "packages=true。test_all が走ります"

  test_all:
    needs: check_paths
    if: ${{ needs.check_paths.outputs.packages_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: NPM install
        run: npm install

      - name: Build
        run: npm run build

      - name: Type Check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      # 歯。門が自分の入力を直していないことを、出力で測る。
      # lint が eslint --fix に戻されると、自動修正できる違反が在るファイルが
      # ここで書き換わり、git diff が空でなくなる。
      #
      # ⚠ 限界を歯自身に名乗らせておく:
      #   自動修正できる違反が実際に在る PR でしか発火しない。いまの main では
      #   eslint --fix は 1 ファイルも書き換えないので、ふだんこの歯は何も測っていない。
      #   ⟹ 「緑だった」を「lint は検査専用のままだ」と読まないこと。
      - name: lint が作業ツリーを書き換えていないか (門が入力を直していないことの確認)
        run: |
          if ! git diff --exit-code; then
            echo "::error::AssertionError: npm run lint が作業ツリーを書き換えました。lint は検査専用のはずです (自動修正は npm run lint:fix)"
            exit 1
          fi

      - name: Test
        run: npm run test

      - name: Build Storybook
        run: npm run build-storybook

  test_desktop:
    needs: check_paths
    if: ${{ needs.check_paths.outputs.packages_changed != 'true' && needs.check_paths.outputs.desktop_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: NPM install
        run: npm install

      - name: Build
        run: npm run build

      - name: Type Check
        run: npm run tsc -w desktop

      - name: Lint
        run: npm run lint -w desktop

      # 歯。門が自分の入力を直していないことを、出力で測る。
      # lint が eslint --fix に戻されると、自動修正できる違反が在るファイルが
      # ここで書き換わり、git diff が空でなくなる。
      #
      # ⚠ 限界を歯自身に名乗らせておく:
      #   自動修正できる違反が実際に在る PR でしか発火しない。いまの main では
      #   eslint --fix は 1 ファイルも書き換えないので、ふだんこの歯は何も測っていない。
      #   ⟹ 「緑だった」を「lint は検査専用のままだ」と読まないこと。
      - name: lint が作業ツリーを書き換えていないか (門が入力を直していないことの確認)
        run: |
          if ! git diff --exit-code; then
            echo "::error::AssertionError: npm run lint が作業ツリーを書き換えました。lint は検査専用のはずです (自動修正は npm run lint:fix)"
            exit 1
          fi

      - name: Test
        run: npm run test -w desktop

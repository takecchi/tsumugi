name: Backend Released

# backend から repository_dispatch(event_type=backend-released) で通知が来た場合と、
# 手動で workflow_dispatch した場合の両方に対応する。
# ⭐ 重要: この2つの経路は最初のstep(normalize)で1組のstep outputへ合流させ、
# 以降の全stepはそのoutputだけを見る。経路ごとに別ロジックを書くと、
# 手で検証した経路と本番経路が乖離してしまうため。
# dry_run(後述)についても同様に、この1本の正規化stepで1つのoutputに落とす。
on:
  repository_dispatch:
    types: [backend-released]
  workflow_dispatch:
    inputs:
      version:
        description: "通知されたバージョン（vを外したもの。例: 1.3.6）"
        required: true
        type: string
      release_tag:
        description: "リリースタグ（例: v1.3.6）。無ければ空でよい"
        required: false
        type: string
      previous_tag:
        description: "直前のタグ。初回リリース等で無ければ空でよい"
        required: false
        type: string
      breaking:
        description: "true / false / unknown / 空 のいずれも試せるよう自由入力にする（choiceにしない）"
        required: false
        type: string
      package:
        description: "追随対象のパッケージ名（既定: @tsumugi-chan/client）"
        required: false
        type: string
      dry_run:
        description: "trueなら版上げ(npm install等)だけ行いpush/PR作成はしない。手動実行の既定は安全側のtrue"
        required: false
        type: boolean
        default: true

# 同じバージョンの通知が重なって競らないようにする。
# 通知の取りこぼしを避けたいので cancel-in-progress は使わない。
concurrency:
  group: backend-released-${{ github.event.client_payload.version || github.event.inputs.version || 'unknown' }}
  cancel-in-progress: false

# このリポジトリの既定はread-onlyのため、必要な権限をここで明示する。
permissions:
  contents: write
  pull-requests: write

jobs:
  bump-client-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ⭐ ここで repository_dispatch(client_payload) と workflow_dispatch(inputs) を
      # 1組のstep outputへ正規化する。以降のstepはこのoutputだけを参照する。
      # 値は env 経由でシェルへ渡す（run内で直接 ${{ }} を展開するとinjectionの経路になるため）。
      - name: 入力を正規化する
        id: normalize
        env:
          IN_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          IN_RELEASE_TAG: ${{ github.event.client_payload.release_tag || github.event.inputs.release_tag }}
          IN_PREVIOUS_TAG: ${{ github.event.client_payload.previous_tag || github.event.inputs.previous_tag }}
          IN_BREAKING_RAW: ${{ github.event.client_payload.breaking || github.event.inputs.breaking }}
          IN_PACKAGE: ${{ github.event.client_payload.package || github.event.inputs.package }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          VERSION="${IN_VERSION:-}"
          RELEASE_TAG="${IN_RELEASE_TAG:-}"
          PREVIOUS_TAG="${IN_PREVIOUS_TAG:-}"
          BREAKING_RAW="${IN_BREAKING_RAW:-}"
          PACKAGE="${IN_PACKAGE:-}"

          # version がどちらの経路からも来ていなければ、何を更新すればよいか分からないので明示的に失敗させる。
          if [ -z "$VERSION" ]; then
            echo "::error::version が client_payload / inputs のどちらにも含まれていません。処理を中止します。"
            exit 1
          fi

          # breaking は true / false の2値だけを採用する。
          # unknown・空・未定義・想定外の語はすべて unknown に丸める。
          # 「falseではない」ことが重要なので、絶対に false へは倒さない。
          case "$BREAKING_RAW" in
            true) BREAKING="true" ;;
            false) BREAKING="false" ;;
            *) BREAKING="unknown" ;;
          esac

          # package は空なら既定値を補う。@tsumugi-chan/client 以外はこのワークフローが
          # 追随方法を知らないため明示的に失敗させる。
          if [ -z "$PACKAGE" ]; then
            PACKAGE="@tsumugi-chan/client"
          fi
          if [ "$PACKAGE" != "@tsumugi-chan/client" ]; then
            echo "::error::このワークフローは @tsumugi-chan/client 以外の追随方法を知りません（package=${PACKAGE}）。処理を中止します。"
            exit 1
          fi

          # dry_run は workflow_dispatch の入力だけを見る。
          # repository_dispatch(本番通知)は必ず実行したいので、ここで強制的にfalseへ倒す。
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            DRY_RUN="false"
          else
            case "${IN_DRY_RUN:-}" in
              true) DRY_RUN="true" ;;
              false) DRY_RUN="false" ;;
              *) DRY_RUN="true" ;;
            esac
          fi

          # previous_tag / release_tag は空・欠落のまま保持する（でっち上げない）。
          {
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "breaking=${BREAKING}"
            echo "breaking_raw=${BREAKING_RAW}"
            echo "package=${PACKAGE}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

      # secretの値そのものは絶対に出力せず、有無だけを見る。
      # dry_run のときはPRを作らずトークンも使わないので検査自体を省略するが、
      # 黙って飛ばさず「省略した」ことと有無を出力する。
      - name: "secret(APP_ID / APP_PRIVATE_KEY)の有無を検査する"
        id: check-secrets
        env:
          DRY_RUN: ${{ steps.normalize.outputs.dry_run }}
          HAS_APP_ID: ${{ secrets.APP_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          to_ja() {
            if [ "$1" = "true" ]; then echo "有"; else echo "無"; fi
          }

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run なので secret 検査を省略した。APP_ID の有無: $(to_ja "$HAS_APP_ID") / APP_PRIVATE_KEY の有無: $(to_ja "$HAS_APP_PRIVATE_KEY")"
            exit 0
          fi

          MISSING=""
          [ "$HAS_APP_ID" = "true" ] || MISSING="${MISSING}APP_ID "
          [ "$HAS_APP_PRIVATE_KEY" = "true" ] || MISSING="${MISSING}APP_PRIVATE_KEY "

          if [ -n "$MISSING" ]; then
            echo "::error::takecchi/tsumugi の secrets に APP_ID / APP_PRIVATE_KEY が必要です（欠けているsecret: ${MISSING})"
            exit 1
          fi

          echo "APP_ID / APP_PRIVATE_KEY はいずれも設定されています。"

      # 必要な secret はこの2つ: APP_ID（GitHub AppのApp ID） / APP_PRIVATE_KEY（その秘密鍵）。
      # dry_run のときはPRを作らないためトークンは要らない。
      - name: PR作成用トークンを発行する
        id: app-token
        if: steps.normalize.outputs.dry_run != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 発行したトークンを GH_TOKEN という名前に統一して以降のstepへ渡す。
      # gh コマンドは GH_TOKEN を自動で見るため、以降のstepでの分岐が要らなくなる。
      - name: トークンを GH_TOKEN として以降のstepに渡す
        if: steps.normalize.outputs.dry_run != 'true'
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      # ⭐ 版上げ(npm pkg set / npm install)より「先に」ブランチを切る。
      #
      # 🔴 なぜ順序が効くのか (#68)。
      #   以前このcheckoutは版上げの後ろに在り、作業ツリーが汚れた状態で
      #     git checkout -B "${BRANCH}" origin/main
      #   を打っていた。git はこのとき、汚れているファイルが HEAD と始点
      #   (origin/main) で異なると checkout を中断する:
      #     error: Your local changes to the following files would be overwritten by checkout:
      #       package-lock.json
      #       packages/adapter/api/package.json
      #     Please commit your changes or stash them before you switch branches.
      #     Aborting
      #   ⟹ run のチェックアウト以降に main がその2ファイルについて動いていると落ちる
      #      (直前の git fetch origin main で origin/main が進むため)。
      #
      #   実測 (手元に空の repo を作り、git 2.47.3 で4通り撃った):
      #     汚したファイルが HEAD と始点で異なる    → EXIT=1 中断
      #     汚したファイルが HEAD と始点で同一      → EXIT=0 汚れを持ったまま切替
      #     汚れの中身が始点と同一・HEADとは異なる  → EXIT=1 中断
      #       ⟹ 「中身が始点と同じなら通る」ではない。index が HEAD 版のままなので中断する。
      #     切ってから汚す (この形)                 → EXIT=0
      #
      #   ⟹ これを踏んだのは run 34354449082 の attempt 2 (再実行)。fetch の出力が
      #      `a42f57f..1dbdb21  main -> origin/main` で、その区間に 9e16923
      #      (1.3.8 を手で入れた commit) が含まれていた。⟹ package.json と
      #      package-lock.json の両方が HEAD と origin/main で食い違い、中断した。
      #   ⟹ 再実行は前の attempt から時間が経っているぶん main が動いている公算が高い。
      #      「権限を直したので再実行して確かめる」という手順が、これで塞がれていた。
      #      (⚠ 「再実行なら必ず落ちる」ではない。落ちる条件は上の2ファイルが
      #        HEAD と origin/main で食い違うことで、main が別のファイルだけ
      #        動いた場合は通る。実測の2番目がそれ。)
      #
      # ⟹ 汚れが生まれる前に切ることで、中断の経路そのものを無くす。
      #   ⛔ このstepを版上げ(下の「依存バージョンを更新する」)より後ろへ動かさないこと。
      #      戻すと上の中断が再発する。test.yaml の check-draft に、この順序を
      #      構造で測る歯 (検査 4) を置いてある。
      #
      # ⚠ if: を付けていない (＝ 追随不要のときも切る) 理由:
      #   1. このstepは「現在の依存バージョンを読む」より前に居る必要があるので、
      #      あのstepの output には依存できない。
      #   2. push しない。ローカルにブランチを作るだけなので、外への副作用が無い。
      #   3. ⭐ 追随不要で終わる run でも checkout -B が実際に走る。⟹ PRを1本も
      #      作らずに、再実行がこの不具合を踏まないことを確かめられる。
      #
      # ⚠ dry_run でもこのstepは走る。dry_run と本番で経路を分けない
      #   (このファイル冒頭のコメントの方針)。push は本番経路にしか無い。
      #
      # ⚠ 「現在の依存バージョンを読む」より前に置いた理由 (#68 で意味が変わる箇所):
      #   以前は current_version を「run がチェックアウトした commit」から読み、
      #   commit は origin/main の上に作っていた。⟹ 読んだ木と作る木が食い違いうる。
      #   main が既にその版へ手で追随済みだと (9e16923 で実際に起きた)、
      #   「追随必要」と判定 → 版上げしても差分ゼロ → git commit が
      #   「nothing to commit」で落ちる、という別の倒れ方になる。
      #   ⟹ 先に origin/main へ切ってから読めば、判定・版上げ・commit がすべて
      #      同じ木の上で起きる。判定が「不要」へ倒れるのは origin/main が既に
      #      その版を持つときだけなので、追随が必要なのに不要と判定することは無い
      #      (＝ 黙って終わる向きへは倒れない)。
      #   ⚠ 副次: PRタイトル/本文/commitメッセージの「X から Y へ」の X が、
      #      実際の差分の基点と一致するようになる。
      - name: 版上げより先にブランチを作る
        env:
          BRANCH: chore/bump-client-${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main

          # 歯。このstepが「汚れる前」に居ることを実行時にも測る。順序をコメントだけで
          # 守らせない。順序が戻されると、checkout の中断より先に、原因の名前で落ちる。
          #
          # ⚠ この歯が測っているのは「原因が消えたこと」(checkout -B の直前で作業ツリーが
          #   汚れていないこと) であって、「checkout -B が成功すること」ではない。
          # ⚠ この歯は PR の CI では 1 度も走らない。backend-released.yaml は
          #   pull_request では発火しないため。⟹ PR の段で順序を守るのは
          #   test.yaml の check-draft に置いた構造の歯 (検査 4) のほう。
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::AssertionError: git checkout -B の前で作業ツリーが汚れています。この状態で checkout -B を打つと、汚れたファイルが HEAD と origin/main で異なるとき git が中断します (#68)。版上げするstepがこのstepより前に来ていないか確認してください"
            printf '%s\n' "$DIRTY"
            exit 1
          fi

          # ブランチ名は版から決まる決定的な名前にし、常にorigin/mainから作り直す。
          # 同じ版の再通知が来てもブランチが増えず、既存PRの更新に落ちるようにするため。
          #
          # ⚠ 接頭辞が既存の慣習と違うのは意図的です（手作業の追随PRは chore/client-<version> を使ってきた）。
          # この後の「force push する」stepで force push するため、慣習に揃えると
          # 人が手で作った chore/client-<version> を踏み潰す事故が起こりえます。
          # ⟹ 「慣習に合っていない」という理由で揃えないでください。
          #
          # （↑ この4行は元は「ブランチを作りcommitする」stepに在った原文です。#68 で
          #   checkout を版上げの前へ移したのに伴い、原文の「このstepの直後で force push
          #   するため」だけを「この後の『force push する』stepで force push するため」へ
          #   直しました。接頭辞についての結論は原文のままで、変えていません。）
          git checkout -B "${BRANCH}" origin/main

      - name: Node セットアップ
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 現在の依存バージョンを読む。npm pkg get はワークスペース名をキーにしたJSONを返すため jq で1値に落とす。
      - name: 現在の依存バージョンを読む
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(npm pkg get "dependencies.@tsumugi-chan/client" --workspace=packages/adapter/api | jq -r '[.[]][0]')
          echo "current_version=${CURRENT}" >> "$GITHUB_OUTPUT"

      # 通知された版と現在の版が同じなら、上げるものが無い。
      # 空PRは作れないため、ここでJob Summaryに書いて正常終了する。
      # ⚠ 新旧比較で「古い通知だからskip」というガードはここでは行わない。常に通知された版へ追随する。
      - name: 既に同じ版なら追随不要として終わる
        if: steps.current.outputs.current_version == steps.normalize.outputs.version
        run: |
          {
            echo "### backend-released: 追随不要"
            echo ""
            echo "通知されたバージョン \`${{ steps.normalize.outputs.version }}\` は既に \`packages/adapter/api/package.json\` に反映済みです。PRは作成しません。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 依存バージョンを更新する。存在しない版が来た場合は、この後のnpm installで大きく失敗させるのが望ましい。
      # dry_run でもここは実際に実行する（変更が本当に作れることを確かめたいため）。
      - name: 依存バージョンを更新する
        if: steps.current.outputs.current_version != steps.normalize.outputs.version
        run: npm pkg set "dependencies.@tsumugi-chan/client=${{ steps.normalize.outputs.version }}" --workspace=packages/adapter/api

      - name: package-lock.json を更新する
        if: steps.current.outputs.current_version != steps.normalize.outputs.version
        run: npm install

      # PRのタイトルと本文は、dry_run時のプレビューと実際のPR作成の両方で
      # 同じものを使う（ここで1回だけ組み立てる）。
      # 本文はヒアドキュメントでファイルに書き出し、--body-file で渡す（クォート事故を避けるため）。
      - name: PRタイトル・本文を組み立てる
        if: steps.current.outputs.current_version != steps.normalize.outputs.version
        id: body
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          RELEASE_TAG: ${{ steps.normalize.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.normalize.outputs.previous_tag }}
          BREAKING: ${{ steps.normalize.outputs.breaking }}
          BREAKING_RAW: ${{ steps.normalize.outputs.breaking_raw }}
          PACKAGE: ${{ steps.normalize.outputs.package }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_VERSION: ${{ steps.current.outputs.current_version }}
        run: |
          set -euo pipefail

          fmt() {
            if [ -z "${1:-}" ]; then
              echo "(通知に含まれていません)"
            else
              echo "$1"
            fi
          }

          # breaking=true のときはtitleでも分かるようにConventional Commitsの破壊的変更記法(!)を使う。
          if [ "$BREAKING" = "true" ]; then
            TITLE="chore(deps)!: @tsumugi-chan/client を ${CURRENT_VERSION} から ${VERSION} へ更新（破壊的変更あり）"
          else
            TITLE="chore(deps): @tsumugi-chan/client を ${CURRENT_VERSION} から ${VERSION} へ更新"
          fi
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

          {
            if [ "$BREAKING" = "true" ]; then
              echo "> **破壊的変更を含むリリースです。** この PR の CI が赤いなら、それは backend の API が壊れる変更を含んでいるという意味です。"
              echo ""
            elif [ "$BREAKING" = "unknown" ]; then
              echo "> **breaking の判定が取れていません（false ではありません）。** 送信された生の値: \`$(fmt "${BREAKING_RAW:-}")\`"
              echo ""
            fi

            echo "## backend リリース通知への追随"
            echo ""
            echo "backend のリリース通知を受けて \`@tsumugi-chan/client\` を更新します。"
            echo ""
            echo "### 通知された内容"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| version | $(fmt "${VERSION:-}") |"
            echo "| release_tag | $(fmt "${RELEASE_TAG:-}") |"
            echo "| previous_tag | $(fmt "${PREVIOUS_TAG:-}") |"
            echo "| breaking（正規化後） | ${BREAKING} |"
            echo "| breaking（生の値） | $(fmt "${BREAKING_RAW:-}") |"
            echo "| package | $(fmt "${PACKAGE:-}") |"
            echo ""
            echo "### トリガ"
            echo ""
            echo "- イベント: \`${EVENT_NAME}\`"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "- これは手動の確認用の実行です。"
            fi
            echo ""
            echo "### この PR に走るチェック"
            echo ""
            echo "- \`Test Workflow\`（\`test.yaml\`）の \`check-draft\` → \`check_paths\` → \`test_all\`"
            echo "- \`test_desktop\` は依存関係の変更のみのため skip される見込みです"
          } > pr-body.md

      # ⭐ secret 無しでも測れる経路。ここから先(commit/push/PR作成)は一切行わず、
      # 何をするつもりだったかを標準出力とJob Summaryの両方に出して終える。
      - name: dry_run のときは実行内容を出力して終える
        if: steps.current.outputs.current_version != steps.normalize.outputs.version && steps.normalize.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.normalize.outputs.version }}
          TITLE: ${{ steps.body.outputs.title }}
        run: |
          set -euo pipefail
          # 接頭辞 chore/bump-client- を使う理由は「版上げより先にブランチを作る」stepのコメントを参照。
          BRANCH="chore/bump-client-${VERSION}"

          # gh は一切呼ばない。代わりにoriginに同名ブランチが在るかで新規/更新を代替判定する。
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            DECISION="既存PRを更新する経路に入る見込み（※ gh pr list の代替として、originに同名ブランチ ${BRANCH} が存在するかで判定。実際にはghを呼んでいません）"
          else
            DECISION="新規PRを作成する経路に入る見込み（※ gh pr list の代替として、originに同名ブランチ ${BRANCH} が存在するかで判定。実際にはghを呼んでいません）"
          fi

          {
            echo "## dry_run: ここから先(push・PR作成)は実行していません"
            echo ""
            echo "- 作るつもりのブランチ名: \`${BRANCH}\`"
            echo ""
            echo "### git diff --stat"
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "### git diff（packages/adapter/api/package.json）"
            echo '```diff'
            git diff -- packages/adapter/api/package.json
            echo '```'
            echo ""
            echo "### PRタイトル（予定）"
            echo "\`${TITLE}\`"
            echo ""
            echo "### PR本文（予定・全文）"
            echo '```markdown'
            cat pr-body.md
            echo '```'
            echo ""
            echo "### 新規作成 / 更新の判定"
            echo "${DECISION}"
          } > dry-run-report.md

          # パイプで繋ぐと終了コードが最後のコマンドのものになり嘘をつくため、
          # 一度ファイルへ書いてから標準出力とJob Summaryへ別々に流す。
          cat dry-run-report.md
          cat dry-run-report.md >> "$GITHUB_STEP_SUMMARY"

      # ブランチは「版上げより先にブランチを作る」stepで既に切ってある (#68)。
      # ここは commit だけを行う。⛔ このstepへ checkout を戻さないこと
      # (作業ツリーが汚れた状態の checkout -B は、main が動いていると中断する)。
      - name: 変更をcommitする
        if: steps.current.outputs.current_version != steps.normalize.outputs.version && steps.normalize.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/adapter/api/package.json package-lock.json
          git commit -m "chore(deps): @tsumugi-chan/client を ${{ steps.current.outputs.current_version }} から ${{ steps.normalize.outputs.version }} へ更新"

      - name: force push する
        if: steps.current.outputs.current_version != steps.normalize.outputs.version && steps.normalize.outputs.dry_run != 'true'
        env:
          BRANCH: chore/bump-client-${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"

      # 🔴 このstepが失敗するとき (#71): 直前の「force push する」stepは既に成功しており、
      # ブランチの中身(版上げcommit)は origin に存在する。足りないのは「PRを開く/更新する」その一手だけ。
      # 本番経路(repository_dispatch)は史上2回とも、GitHub Appに Pull requests: write 権限が
      # 無いために `Resource not accessible by integration` でここが落ちている。これはyamlでは
      # 直せない(人間がGitHub App側の権限設定を直す話)ため、このstepでは「落ちたまま」
      # 人間が手で回復できるだけの情報を出す。
      #
      # ⛔ continue-on-error は使わない。人間が気付けなくなる。失敗は失敗のまま最後まで伝える。
      # ⚠ set -euo pipefail の下で `gh pr create/edit` の失敗理由(標準エラー)を掴むため、
      #   ここだけ `コマンド 2>ファイル || STATUS=$?` の形にして、失敗を検知したら自前で
      #   exit 1 する(pipeで繋いで拾うと、pipefail下でも読み手の意図と違う終了コードに
      #   化けやすいため使わない)。
      - name: PRを作成または更新する
        if: steps.current.outputs.current_version != steps.normalize.outputs.version && steps.normalize.outputs.dry_run != 'true'
        env:
          BRANCH: chore/bump-client-${{ steps.normalize.outputs.version }}
          TITLE: ${{ steps.body.outputs.title }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ERR_FILE=$(mktemp)

          # 同じ版の通知が重複してもPRが増えないよう、既存PRの有無を先に確認する。
          EXISTING=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            ACTION="更新(gh pr edit)"
            STATUS=0
            gh pr edit "$EXISTING" --title "$TITLE" --body-file pr-body.md 2>"$ERR_FILE" || STATUS=$?
          else
            ACTION="作成(gh pr create)"
            STATUS=0
            gh pr create --base main --head "${BRANCH}" --title "$TITLE" --body-file pr-body.md 2>"$ERR_FILE" || STATUS=$?
          fi

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          # ここから先は失敗確定。人間可読なエラーと、手で回復するための情報を残してから落ちる。
          ERR_OUTPUT=$(cat "$ERR_FILE")
          echo "$ERR_OUTPUT" >&2

          COMPARE_URL="${SERVER_URL}/${REPO}/compare/main...${BRANCH}?expand=1"

          # `Resource not accessible by integration` は権限不足で確定しているケース。
          # それ以外(rate limit・一時的な障害等)まで権限不足と決めつけないよう文言を分ける。
          if printf '%s' "$ERR_OUTPUT" | grep -qF "Resource not accessible by integration"; then
            echo "::error::PRの${ACTION}に失敗しました。この repo に対する GitHub App の Pull requests 権限が不足している可能性が高いです。手で回復してください（Job Summary参照）。"
          else
            echo "::error::PRの${ACTION}に失敗しました。原因は不明です。手で回復してください（Job Summary参照）。"
          fi

          {
            echo "## PRの${ACTION}に失敗しました。手で回復してください"
            echo ""
            echo "変更は既に \`${BRANCH}\` へ push 済みです（直前の「force push する」stepは成功しています）。"
            echo "以下のURLから手でPRを作成してください。"
            echo ""
            echo "${COMPARE_URL}"
            echo ""
            echo "### 用意していたPRタイトル"
            echo ""
            echo "\`${TITLE}\`"
            echo ""
            echo "### 用意していたPR本文"
            echo ""
            echo '```markdown'
            cat pr-body.md
            echo '```'
            echo ""
            echo "### ghのエラー出力"
            echo ""
            echo '```'
            echo "$ERR_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1
